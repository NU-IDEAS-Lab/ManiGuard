# Pi0.5 SFT on a Sentinel "clutter pickup" corpus.
#
# Parametric config. Point it at any LeRobot dataset repo_id produced by
# tools/hdf5_to_lerobot.py by setting the env vars below; the dataconfig
# entry (pi05_sentinel_clutter_family) is a generic alias that reads the
# repo_id from $SENTINEL_LEROBOT_REPO_ID.
#
# Launch:
#   export SENTINEL_PI05_BASE=/path/to/pi05/base
#   export SENTINEL_LEROBOT_ROOT=$PWD/outputs/lerobot_datasets
#   export SENTINEL_LEROBOT_REPO_ID=sentinel/clutter_pickup_v1
#   export EMBODIED_PATH=$PWD/RLinf/examples/sft
#   sudo -E env PATH="$PATH" bash RLinf/examples/sft/run_embodiment_sft.sh \
#       sentinel_clutter_sft_openpi
defaults:
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: "${oc.env:SENTINEL_LOG_ROOT,../results}/sentinel_clutter_sft"
    project_name: rlinf
    experiment_name: "sentinel_clutter_sft"
    logger_backends: ["tensorboard"]

  max_epochs: 5000
  max_steps: -1
  val_check_interval: -1
  save_interval: 500

data:
  # HF_LEROBOT_HOME root. The dataset lives at
  # ${data_path}/${SENTINEL_LEROBOT_REPO_ID}/.
  train_data_paths: ${oc.env:SENTINEL_LEROBOT_ROOT}

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 0

  model:
    precision: null
    model_path: ${oc.env:SENTINEL_PI05_BASE}
    num_action_chunks: 4
    add_value_head: False
    # Default to LoRA -- full-param SFT of Pi0.5 needs ~60 GB RAM for FSDP
    # CPU offload. Flip to False on a bigger box.
    is_lora: True
    lora_rank: 32
    openpi:
      config_name: "pi05_sentinel_clutter_family"
      detach_critic_input: True

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: 500
    total_training_steps: 5000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
