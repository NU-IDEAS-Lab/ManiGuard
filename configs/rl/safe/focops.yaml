# FOCOPS starter hyperparameters for PickAndLiftPrivilegedTask.
#
# Derived from omnisafe's FOCOPS defaults
# (omnisafe/configs/on-policy/FOCOPS.yaml, Apache-2.0).
#
# FOCOPS is more sensitive to focops_eta (trust region) than PPO-Lag.
# Start with focops_eta=0.02 and increase if training is slow/unstable.

# --- env ----------------------------------------------------------------
num_envs: 8
max_steps: 200
reset_mode: cached
arm_controller: joint

# --- training -----------------------------------------------------------
total_timesteps: 5_000_000
n_steps: 128
batch_size: 256
learning_rate: 3.0e-4
seed: 0
output_dir: outputs/safe_rl/focops

# --- lagrange -----------------------------------------------------------
cost_limit: 1.0
lambda_init: 0.0
lambda_lr: 0.035
lambda_upper_bound: 1000.0
lambda_optimizer: Adam

# --- focops-specific ---------------------------------------------------
focops_eta: 0.02         # per-update KL trust-region size η
focops_lam: 1.5          # inner-loop Lagrangian scale ζ on the advantage

# --- cost ---------------------------------------------------------------
cost_source: zero
cost_gamma: 0.99
cost_gae_lambda: 0.95
vf_cost_coef: 0.5

# --- video (optional) ---------------------------------------------------
video_freq: 500_000
video_length: 200
