# PPO post-train for Pi0.5 on the Sentinel "clutter pickup" task family.
#
# One config covers the whole family because SentinelEnv scans
# $SENTINEL_BENCHMARK_ROOT for scene_ep*.json snapshots and treats each
# directory as a separate scene. Point benchmark_root at the dataset dump
# produced by `clutter_scene_pipeline.py`; all scenes there will be
# round-robin'd across env workers during rollout.
#
# benchmark_root / activity_root default to the checked-in
# datasets/safety-benchmark/ and bddl3/bddl/activity_definitions/
# directories. Override via env vars to point at a bigger corpus.
#
# Launch:
#   export SENTINEL_PI05_SFT_CKPT=/path/to/sft/ckpt
#   # SENTINEL_BENCHMARK_ROOT / SENTINEL_ACTIVITY_ROOT optional
#   export EMBODIED_PATH=$PWD/RLinf/examples/embodiment
#   sudo -E bash RLinf/examples/embodiment/run_embodiment.sh \
#       sentinel_clutter_ppo_openpi_pi05
defaults:
  - env/sentinel_franka_tabletop@env.train
  - env/sentinel_franka_tabletop@env.eval
  - model/pi0_5_franka@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    # RLinf vendored model/, training_backend/, etc. defaults.
    - file://${oc.env:EMBODIED_PATH}/config/
    # Sentinel env yamls live in our repo, not in RLinf's tree.
    - file://${oc.env:SENTINEL_CONFIG_ROOT}/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "${oc.env:SENTINEL_LOG_ROOT,../results}/sentinel_clutter_ppo_openpi_pi05"
    project_name: rlinf
    experiment_name: "sentinel_clutter_ppo_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: 500
  max_steps: -1

  only_eval: False
  val_check_interval: 50
  save_interval: 20

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 8
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    # Ramp this up once the pipeline is verified; each env worker is one
    # Isaac Sim process and eats ~2-3 GB VRAM + ~1.5 GB RAM on a Franka scene.
    total_num_envs: 4
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    reward_coef: ${algorithm.reward_coef}
    sentinel_cfg:
      # Default: the checked-in datasets/safety-benchmark/ directory, which
      # contains one seeded clutter_goblet_00 scene today. Override via
      # SENTINEL_BENCHMARK_ROOT when you've produced a bigger corpus.
      benchmark_root: ${oc.env:SENTINEL_BENCHMARK_ROOT,/home/nu-ideas-4080/Desktop/projects/SENTINEL-Lite/datasets/safety-benchmark}
      activity_root: ${oc.env:SENTINEL_ACTIVITY_ROOT,/home/nu-ideas-4080/Desktop/projects/SENTINEL-Lite/behavior-1k/bddl3/bddl/activity_definitions}
      # null = scan benchmark_root and use every scene.
      scene_names: null
      max_scenes: null
      camera_source: deterministic_eval
      headless: True
      use_gpu_dynamics: False

  eval:
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    sentinel_cfg:
      benchmark_root: ${oc.env:SENTINEL_EVAL_BENCHMARK_ROOT,${oc.env:SENTINEL_BENCHMARK_ROOT,/home/nu-ideas-4080/Desktop/projects/SENTINEL-Lite/datasets/safety-benchmark}}
      activity_root: ${oc.env:SENTINEL_ACTIVITY_ROOT,/home/nu-ideas-4080/Desktop/projects/SENTINEL-Lite/behavior-1k/bddl3/bddl/activity_definitions}
      scene_names: null
      max_scenes: null
      camera_source: deterministic_eval
      headless: True
      use_gpu_dynamics: False

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  # Arbitrary string; only used to namespace normalization stats when the
  # rollout backend saves them. Keep distinct across task families.
  unnorm_key: sentinel_clutter
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # Small defaults suitable for a single ~24 GB GPU box. On a multi-GPU
  # cluster, bump micro_batch_size and global_batch_size accordingly.
  micro_batch_size: 8
  global_batch_size: 32
  seed: 42
  enable_offload: False

  model:
    # Start RL from the SFT checkpoint; set it via SENTINEL_PI05_SFT_CKPT.
    # Falling back to the stack-cube SFT ckpt lets the config import cleanly
    # but it won't have been trained on the clutter task.
    model_path: ${oc.env:SENTINEL_PI05_SFT_CKPT,${oc.env:SENTINEL_PI05_BASE,/path/to/sft/ckpt}}
    model_type: "openpi"
    # PPO needs a value head; we add it here and warm it up before the
    # actor starts updating (see optim.critic_warmup_steps).
    add_value_head: True
    openpi:
      value_after_vlm: True
      config_name: "pi05_franka_tabletop"

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    # Warm the critic first so early actor updates have a sane advantage signal.
    critic_warmup_steps: 50
    total_training_steps: 500
    min_lr_rate: 0.1
    lr_scheduler: "cosine"

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
