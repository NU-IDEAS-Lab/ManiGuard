# Reference renderer retained during DLAA consolidation; not the default.
name: path_tracing_reference
resolution: [640, 640]
camera_keys: [image_left, image_right, image_left_shoulder, image_opposite, wrist_image]
renderer: PathTracing
total_spp: 128
spp_per_update: 16
max_bounces: 8
max_specular_transmission_bounces: 12
denoiser: optix_single_frame
tonemap: aces
motion_blur: false
depth_of_field: false
frame_generation: false
rgb_encoding: {codec: jpeg, quality: 95, subsampling: '444', color_order: RGB}
