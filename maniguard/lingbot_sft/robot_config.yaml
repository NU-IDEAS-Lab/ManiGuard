# Feature mapping for a single-arm Franka with overview and wrist images.
# State/action layout: seven arm joints followed by one gripper coordinate.
# Map arm.position from [0:7) and effector.position from [7:8).
# Actions are absolute because subtract_state is false.
# The loader supplies unused unified-vector dimensions. Extra dataset views
# are not mapped. run_sft.sh explicitly selects the family normalization file.

states:
  - observation.state.arm.position:
      origin_keys:
        - state:
            start: 0
            end: 7

  - observation.state.effector.position:
      origin_keys:
        - state:
            start: 7
            end: 8

actions:
  - action.arm.position:
      origin_keys:
        - actions:
            start: 0
            end: 7
      subtract_state: False

  - action.effector.position:
      origin_keys:
        - actions:
            start: 7
            end: 8
      subtract_state: False

images:
  - observation.images.camera_top:
      origin_keys: image_left
  - observation.images.camera_wrist_left:
      origin_keys: wrist_image

norm_stats: assets/norm_stats/maniguard_clutter.json
