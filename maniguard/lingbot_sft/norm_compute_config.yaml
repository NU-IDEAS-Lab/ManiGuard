# Normalization-statistics configuration for LingBot.
# The upstream statistics entry point accepts data and train sections.
# Keep joints, cameras, and norm_type consistent with train_config.yaml.
# run_sft.sh supplies train_path and norm_path for the selected family.

data:
  datasets_type: vla
  data_name: maniguard
  train_path: ''
  robot_config_root: ./configs/robot_configs
  norm_path: ''
  joints:
    - arm.position: 14
    - end.position: 14
    - effector.position: 2
  cameras:
    - camera_top
    - camera_wrist_left
  norm_type:
    - arm.position: bounds_99_woclip
    - end.position: bounds_99_woclip
    - effector.position: bounds_99_woclip
  num_workers: 8

train:
  micro_batch_size: 48
  output_dir: ''
  max_steps: 100000000000000
