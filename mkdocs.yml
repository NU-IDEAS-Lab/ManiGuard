# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: ManiGuard
site_description: LTL safety, task generation, and VLA policy eval on top of BEHAVIOR-1K
site_url: https://nu-ideas-lab.github.io/ManiGuard/
repo_name: NU-IDEAS-Lab/ManiGuard
repo_url: https://github.com/NU-IDEAS-Lab/ManiGuard
edit_uri: edit/dev/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: indigo
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: indigo
      accent: indigo
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/mg-carousel.css

extra_javascript:
  - javascripts/mg-carousel.js

# Files / globs to ignore when building.
exclude_docs: |
  graspability_classified.csv
  graspability_classified.html

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
  - Concepts & Foundations:
      - Architecture overview: architecture/overview.md
      - Environment layer: foundations/env_layer.md
      - LTL safety system: foundations/ltl_safety.md
      - OmniGibson patches & configs: foundations/omnigibson_patches.md
  - Task Generation:
      - Pipelines overview: pipelines/index.md
      - Bench families:
          - Clutter pickup: pipelines/clutter_pickup.md
          - Cabinet pickup: pipelines/cabinet_pickup.md
          - Stack retrieve: pipelines/stack_retrieve.md
          - Jar transport: pipelines/jar_transport.md
          - Dusty transfer: pipelines/dusty_transfer.md
          - Lid transport: pipelines/lid_transport.md
      - Generation infrastructure:
          - Data flow: pipelines/data_flow.md
          - Add a custom pipeline: pipelines/custom_pipeline.md
          - Empty-scene runner: pipelines/empty_scene.md
          - Food transfer (base): pipelines/transfer.md
      - Additional families: pipelines/other_families.md
  - Data Collection:
      - Overview: data_collection/index.md
      - Teleop:
          - SO-101 → Franka: teleop/so101_franka.md
          - SO-101 ZMQ server: teleop/so101_server.md
          - GELLO → Franka: teleop/gello_franka.md
          - GELLO calibration: teleop/gello_calibration.md
          - Playback / render: teleop/playback.md
          - Sim teleop → LeRobot: teleop/teleop_to_lerobot.md
          - Real-robot teleop: teleop/real_teleop.md
      - Scripted datagen:
          - Pipeline: datagen/pipeline.md
          - Grasp annotation: datagen/grasp_annotation.md
          - RAW → LeRobot conversion: datagen/lerobot_conversion.md
  - SFT:
      - Overview: sft/index.md
      - Dataset & data-source configs: sft/dataset_and_config.md
      - openpi / pi0.5: sft/openpi.md
      - GR00T (N1.6): sft/gr00t.md
      - SmolVLA: sft/smolvla.md
      - Controller · data · action · eval: sft/end_to_end.md
  - Evaluation:
      - Overview: evaluation/index.md
      - Engagement & contact-gated safety: evaluation/engagement_metric.md
  - Reference: reference.md
