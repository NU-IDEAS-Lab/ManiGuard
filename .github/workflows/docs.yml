name: docs

# Build the site and publish it to GitHub Pages (gh-pages branch):
#   /       <- page/  (the project page; currently a redirect to docs/)
#   /docs/  <- the MkDocs documentation build
# Pages source: repo Settings → Pages → "Deploy from a branch" → gh-pages.
on:
  push:
    branches: [dev]
    paths:
      - docs/**
      - page/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict -d _site/docs
      - run: cp -r page/. _site/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
