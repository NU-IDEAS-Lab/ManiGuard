# Root ruff config for sentinel-lite.
# The behavior-1k submodule has its own ruff.toml; exclude it here so we
# only lint sentinel-owned code from the repo root.

extend-exclude = [
    "behavior-1k/",
    "RLinf/",
    "vla_models/",
    "Omnireset/",
    "outputs/",
    "datasets/",
    "log_dir/",
]

line-length = 120
indent-width = 4
