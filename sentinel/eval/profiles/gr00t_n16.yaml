name: gr00t_n16
# GR00T-N1.6-DROID uses the OXE_DROID embodiment: relative joint-position
# actions over 7 Franka joints + 1 gripper. See Isaac-GR00T processor_config.json
# -> modality_configs.oxe_droid.
state_mode: joint          # 7 arm_pos + 1 gripper_scalar = 8D
policy_cameras: [cam_opposite]
action_dim: 8
execute_horizon: 16
gripper_binarize: false    # GR00T outputs continuous gripper position
serve_config_name: gr00t_n16_droid
serve_script: sentinel/serve/gr00t_n16_server.py

# DROID's policy outputs absolute joint-position targets in raw radians
# (use_relative_action=True internally, but decode_action converts back to
# absolute using the current state). Gripper is [0, 1] absolute.
# - arm:     accept raw radians (bypass the [-1,1] normalization baked in by
#            the robot's action_normalize=True).
# - gripper: map [0, 1] (DROID convention) -> [0, 0.04] m (Franka panda
#            finger joint limits).
override_controller_config:
  arm_0:
    name: JointController
    motor_type: position
    use_delta_commands: false
    command_input_limits: null
    command_output_limits: null
  gripper_0:
    name: MultiFingerGripperController
    mode: smooth
    command_input_limits: [[0.0], [1.0]]
    command_output_limits: [[0.0], [0.04]]
