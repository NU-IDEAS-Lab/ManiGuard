env:
  device: null
  automatic_reset: false
  flatten_action_space: false
  flatten_obs_space: false
  use_external_obs: false
  initial_pos_z_offset: 0.1
  external_sensors:
    - sensor_type: VisionSensor
      name: cam_opposite
      relative_prim_path: /cam_opposite
      modalities: [rgb]
      sensor_kwargs:
        image_height: 240
        image_width: 416
      position: [0.0, 0.0, 1.2]
      orientation: [0.707, 0.0, 0.0, 0.707]
      pose_frame: parent

render:
  viewer_width: 1280
  viewer_height: 720

scene:
  type: InteractiveTraversableScene
  scene_model: house_double_floor_lower
  trav_map_resolution: 0.1
  default_erosion_radius: 0.0
  trav_map_with_objects: true
  num_waypoints: 1
  waypoint_resolution: 0.2
  not_load_object_categories: null
  load_room_types: null
  load_room_instances: null
  seg_map_resolution: 1.0
  scene_source: OG
  include_robots: true
  scene_file: null
  scene_instance: null

robots:
  - type: FrankaMounted
    obs_modalities: [rgb, proprio]
    include_sensor_names: null
    exclude_sensor_names: null
    scale: 1.0
    self_collisions: true
    action_normalize: true
    action_type: continuous
    grasping_mode: physical
    position: [0.0, 0.0, 0.0]
    orientation: [0.0, 0.0, 0.0, 1.0]
    sensor_config:
      VisionSensor:
        sensor_kwargs:
          image_height: 240
          image_width: 416
    controller_config:
      arm_0:
        name: JointController
        motor_type: position
        command_input_limits: default
        command_output_limits: default
        use_delta_commands: false
        use_impedances: false
      gripper_0:
        name: MultiFingerGripperController
        mode: smooth
        command_input_limits: default
        command_output_limits: default

objects: []

task:
  type: BehaviorTask
  activity_name: picking_up_trash
  activity_definition_id: 0
  activity_instance_id: 0
  predefined_problem: null
  online_object_sampling: false
  debug_object_sampling: null
  highlight_task_relevant_objects: false
  use_presampled_robot_pose: false
  termination_config:
    max_steps: 200
  reward_config:
    r_potential: 1.0
